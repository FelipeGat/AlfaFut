<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AlfaFut">
  <defs>
    <radialGradient id="ball" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="55%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0d3f12"/>
    </radialGradient>
    <linearGradient id="goalLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
  </defs>

  <!-- corpo da bola -->
  <circle cx="32" cy="32" r="30" fill="url(#ball)"/>

  <!-- panels pentagonais sugerindo bola de futebol -->
  <g fill="#0a3a0e" opacity="0.55">
    <polygon points="32,4 38,9 35.7,16 28.3,16 26,9"/>
    <polygon points="56,38 60,46 53.5,52 47,48.5 48,41"/>
    <polygon points="8,38 4,46 10.5,52 17,48.5 16,41"/>
  </g>

  <!-- linhas das costuras -->
  <g stroke="#0a3a0e" stroke-width="0.7" fill="none" opacity="0.4">
    <line x1="32" y1="16" x2="20" y2="22"/>
    <line x1="32" y1="16" x2="44" y2="22"/>
    <line x1="20" y1="22" x2="16" y2="41"/>
    <line x1="44" y1="22" x2="48" y2="41"/>
  </g>

  <!-- letra A em destaque -->
  <path d="M32 16 L18.5 47 L24.4 47 L26.9 41 L37.1 41 L39.6 47 L45.5 47 L32 16 Z M28.7 36 L32 28 L35.3 36 Z" fill="#ffffff"/>

  <!-- linha do gol em laranja -->
  <rect x="20" y="50.5" width="24" height="2.2" rx="1.1" fill="url(#goalLine)"/>

  <!-- brilho sutil em cima -->
  <ellipse cx="22" cy="16" rx="8" ry="3" fill="#ffffff" opacity="0.12"/>
</svg>
