worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # Links de confirmação e de nova senha levam segredo na URL e voltam no Referer: não entram no log.
    map $request_uri $registrar_acesso {
        ~^/(reset-password|verify-email)/ 0;
        default 1;
    }
    log_format acesso '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout acesso if=$registrar_acesso;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 12m;

    # O contêiner roda sem root: arquivos temporários só em /tmp.
    client_body_temp_path /tmp/nginx_client_body;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    proxy_temp_path /tmp/nginx_proxy;
    scgi_temp_path /tmp/nginx_scgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Sem $uri/: pasta em public/ com nome de rota não pode responder no lugar da rota.
        location / {
            try_files $uri /index.php?$query_string;
        }

        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # O navegador precisa rever o service worker a cada visita.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            return 404;
        }
    }
}
