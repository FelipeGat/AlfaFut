services:
  mysql:
    image: mysql:8.4
    container_name: alfafut-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alfafut
      MYSQL_USER: alfafut
      MYSQL_PASSWORD: alfafut
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"
    volumes:
      - alfafut_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: alfafut-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - "8082:8080"

volumes:
  alfafut_mysql_data:
    name: alfafut_mysql_data
