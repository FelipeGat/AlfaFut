services:
  mysql:
    image: mysql:8.4
    container_name: alfafut-mysql
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: alfafut
      MYSQL_USER: alfafut
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - alfafut_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u alfafut -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: alfafut-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  alfafut_mysql_data:
    name: alfafut_mysql_data

networks:
  default:
    ipam:
      config:
        - subnet: 10.253.106.0/24
